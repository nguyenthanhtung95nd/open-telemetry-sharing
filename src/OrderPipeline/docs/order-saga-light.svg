      <title id="order-saga-light-title">Order saga</title>
      <desc id="order-saga-light-desc">Flowchart of the OrderPipeline choreography saga: an order is saved as Pending, Inventory.Api reserves stock, Payment.Api charges, and a declined charge releases the reserved stock automatically.</desc>
